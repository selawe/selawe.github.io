{{ define "main" }}
  <section class="reading">
    <header class="reading-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </header>
    <ul class="prose">
      {{ range where .RegularPages "Params.unlisted" "ne" true }}
        {{ $language := .Params.language }}
        <li>
          <a href="{{ .RelPermalink }}"{{ with $language }} lang="{{ . }}"{{ end }}>{{ .Title }}</a>
          {{ with .Description }}<p{{ with $language }} lang="{{ . }}"{{ end }}>{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
